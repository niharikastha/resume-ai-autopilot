# =============================================================================
# THE COMPANY LIST
# =============================================================================
# PLAN-v2 change 1: this file is the bottleneck of the entire project.
#
# Four connectors already cover the market. The spike's 22 productive boards
# yielded ~5 reachable roles each, so the output target of 8-12 applications a
# day is a function of how many companies are on THIS LIST and almost nothing
# else. Connector code is finished; the list is what scales.
#
# WHAT AN ENTRY IS
#   `slug: Display Name`, where the slug is a GUESS at the company's board
#   identifier - `boards.greenhouse.io/<slug>`, `jobs.lever.co/<slug>`. Blind
#   guesses hit ~24% in the spike, which is high enough to be the primary
#   list-growth technique. `companies:sweep` tries each slug against every
#   connector and records the answer in `company_probes`, so a dead slug is
#   never re-tried and a wrong guess costs one request, once.
#
#   A miss is therefore NOT a mistake in this file. Most of these entries will
#   miss. The ones that hit are the point.
#
# TIER IS AN ESTIMATE, NOT A FACT
#   Tier is the primary pay signal in this system, because the spike found
#   structured salary on 2 of 699 India postings and both were junk. So these
#   groupings do real work in the ranking - and they are starting estimates to
#   correct as actual offers arrive, not researched figures. The bands from
#   PLAN-v2 change 2:
#
#     T1  global company, India engineering office   ~Rs 25-50 LPA
#     T2  well-funded Indian product startup         ~Rs 18-35 LPA
#     T3  Indian mid-market product company          ~Rs 8-18 LPA
#     T4  services / staffing / consultancy          ~Rs 6-12 LPA
#
#   Reclassify freely. A company in the wrong tier is ranked wrongly, which is
#   a real cost, and the dashboard can correct one without editing this file -
#   a tier set by hand there is never overwritten by a later sweep.
#
# THE OBJECT FORM
#   Some boards cannot be guessed. SmartRecruiters ids are case-sensitive and
#   often suffixed - Bosch's board is `BoschGroup`, and `bosch` returns a
#   well-formed 200 with zero postings - so those entries state the ATS and
#   token outright and skip probing entirely:
#
#     bosch:
#       name: Bosch
#       ats: SMARTRECRUITERS
#       token: BoschGroup
#
# DELIBERATELY ABSENT
#   Companies on Workday or an in-house ATS: Amazon, Google, Apple, Microsoft,
#   Oracle, Adobe, Salesforce, Walmart, PayPal, SAP, Uber, TCS, Infosys, Wipro,
#   Accenture. PLAN-v2 phase 6 drops Workday (per-tenant accounts, stateful
#   multi-step flow) and there is no public JSON for the in-house ones, so a hit
#   would produce postings nothing can prefill. Also absent: Keka, Zoho Recruit
#   and Darwinbox tenants, for the reasons in PLAN-v2 change 3.
# =============================================================================

