# =============================================================================
# WHAT COUNTS AS A JOB WORTH APPLYING TO
# =============================================================================
# PLAN-v2 phase 3 step 4. This file is stage 1 of the matching funnel: the free,
# deterministic pass that runs before any embedding is compared or any token is
# spent. Everything here is a HARD rule, evaluated with no model involved.
#
# The division of labour matters. Stage 1 answers "could this person take this
# job at all" - the questions with objective answers, where a model would add
# cost and doubt to something a string comparison settles. Stage 3 answers "is
# this a good fit", which genuinely needs judgement. Anything ambiguous belongs
# in stage 3, not here: a dealbreaker that fires on a good role is invisible,
# because a rejected posting produces no output to notice.
#
# Tuning: every stage logs its survivor count. Real volume is ~3-6 relevant new
# roles a day (PLAN-v2 change 1 - the v1 estimate of 800/day was wrong by two
# orders of magnitude), so if stage 1 is rejecting most of what discovery finds,
# the rules here are too tight rather than the pool being bad.
# =============================================================================

# -----------------------------------------------------------------------------
# TITLES
# -----------------------------------------------------------------------------
# Matched against the NORMALIZED title - lower case, punctuation stripped - so
# write these in lower case and do not worry about "Sr." versus "Sr".
titles:
  # A posting must match at least one. Substring matches, so "engineer" covers
  # "software engineer", "backend engineer" and "engineer, platform".
  include:
    - software engineer
    - software developer
    - backend engineer
    - backend developer
    - full stack engineer
    - full stack developer
    - fullstack engineer
    - fullstack developer
    # Added after running the funnel against the real 4802-posting corpus, which is
    # the only way a gap in this list is visible - a missing include term rejects
    # silently and looks like a quiet market. These were live India-located roles the
    # list was dropping: "Frontend Engineer, Vision", "Senior Frontend Engineer",
    # "AI Agent Engineer", "Agent Engineer". Both spellings of front-end are here
    # because normalizeTitle turns the hyphen into a space, so "Front-End" arrives as
    # "front end" and would not match "frontend".
    - frontend engineer
    - frontend developer
    - front end engineer
    - front end developer
    - agent engineer
    - node js developer
    - nodejs developer
    - node developer
    - javascript developer
    - typescript developer
    - python developer
    - api engineer
    - api developer
    - platform engineer
    - product engineer
    - application developer
    - web developer
    - sde
    - software development engineer
    - member of technical staff
    - ai engineer
    - ml engineer
    - machine learning engineer
    - llm engineer
    - genai engineer
    - generative ai engineer
    - applied ai engineer
    - ai developer
    - rag engineer
    - forward deployed engineer
    # Palantir's name for the same job, and now several others' - three live
    # India roles were being dropped for the spelling alone.
    - deployment strategist
    - deployment engineer

  # Rejected outright, even if an include matched. These are not "worse jobs" -
  # they are jobs a 2024 graduate with ~2 years cannot be hired into, and a
  # tailored resume sent to one is a wasted application on both sides.
  exclude:
    - intern
    - internship
    - trainee
    - apprentice
    - staff engineer
    - staff software
    # Bare "staff" is unusable here, and the reason is worth stating: it would
    # also match "member of technical staff", which is an INCLUDE term and is
    # the standard IC title at funded Indian startups - MTS-1 / MTS-2 is exactly
    # where a two-year engineer sits. Exclude wins over include, so one bare
    # term would silently delete a whole tier of the right jobs. Hence the
    # "Staff <X>" forms are enumerated against the include list above instead.
    - staff backend
    - staff frontend
    - staff full stack
    - staff fullstack
    - staff platform
    - staff product engineer
    - staff application
    - staff web
    - staff api
    - staff python
    - staff javascript
    - staff typescript
    - staff node
    - staff ai
    - staff ml
    - staff machine learning
    - staff llm
    - staff genai
    - principal
    - architect
    - head of
    - director
    - vp
    - vice president
    - manager
    - management
    - lead engineer
    - engineering lead
    - tech lead
    - team lead
    - distinguished
    - fellow
    # Adjacent disciplines that share the word "engineer" but are a different job.
    - sales engineer
    - solutions engineer
    - solution engineer
    - support engineer
    - customer engineer
    - field engineer
    - qa engineer
    - test engineer
    - sdet
    - automation engineer
    - devops engineer
    - site reliability
    - sre
    - security engineer
    - network engineer
    - hardware engineer
    - firmware engineer
    - embedded engineer
    - mechanical engineer
    - civil engineer
    - electrical engineer
    - chemical engineer
    - process engineer
    - production engineer
    - manufacturing
    - validation engineer
    - verification engineer
    - design verification
    - analog
    - vlsi
    - rtl
    - physical design
    - data engineer
    - data scientist
    - data analyst
    - business analyst
    - android developer
    - ios developer
    - mobile developer
    - flutter developer
    - unity developer
    - game developer
    - salesforce developer
    - sap
    - abap
    - dotnet
    - net developer
