# -----------------------------------------------------------------------------
# SENIORITY AND EXPERIENCE
# -----------------------------------------------------------------------------
seniority:
  # `seniority()` in normalize.ts derives one of these from the title.
  allow:
    - junior
    - mid
    - senior
  # A senior title is KEPT. PLAN-v2's caveat on the spike numbers is explicit
  # that the title-keyword seniority filter cut genuinely reachable "Senior"
  # roles, and dropping the whole band took the working pool from 115 to 69 -
  # a 40% cut to reach for a word that Indian employers apply to a 3-year
  # engineer as often as to a 10-year one. Stage 3 reads the actual requirement
  # from the description, which is where that judgement belongs.

experience:
  # Years. A posting whose stated minimum is above `maxYears` is rejected;
  # a posting that states no requirement always passes.
  minYears: 0
  maxYears: 6
  # Roughly 2 years as of 2026-09. Update this, or accept that the window above
  # is doing the work on its own.
  candidateYears: 2

# -----------------------------------------------------------------------------
# LOCATION
# -----------------------------------------------------------------------------
locations:
  # Substring matched against the posting's location, case-insensitively.
  # Bhubaneswar is home; the other three are where the roles are.
  allow:
    - bhubaneswar
    - bengaluru
    - bangalore
    - hyderabad
    - pune
    - remote india
    - india
  # REMOTE ELIGIBILITY, not the remote flag. PLAN-v2 change to 1c: the spike
  # found 509 postings tagged remote that were not India-eligible. "Remote - US"
  # is a job that cannot be taken, and treating any "remote" string as a match
  # is how the pool fills with them. `remoteType()` resolves this before the
  # comparison, so REMOTE_OTHER never reaches here.
  allowRemoteIndia: true
  # A role that is remote with no country stated. Kept, because Indian postings
  # routinely say only "Remote", and stage 3 can read the description for a
  # timezone or work-authorisation requirement.
  allowRemoteUnspecified: true

# -----------------------------------------------------------------------------
# CONTENT RULES
# -----------------------------------------------------------------------------
keywords:
  # At least one must appear in the title or description. This is the loosest
  # rule in the file on purpose - it is a sanity check that the posting is about
  # software, not a scoring signal. Scoring is stage 3's job.
  mustHaveAny:
    - javascript
    - typescript
    - node
    - nest
    - express
    - react
    - next.js
    - angular
    - python
    - api
    - backend
    - full stack
    - fullstack
    - microservice
    - rest
    - graphql
    - postgres
    - postgresql
    - mongodb
    - sql
    - llm
    - rag
    - genai
    - generative ai
    - openai
    - anthropic
    - langchain
    - vector database
    - embedding
    - machine learning

  # Present anywhere in the posting and it is rejected. Kept SHORT and
  # unambiguous, because a dealbreaker is a silent rejection - nothing surfaces
  # a job that was thrown away here. Anything requiring interpretation belongs
  # in stage 3, where it becomes a low score with a stated reason instead.
  dealbreakers:
    - unpaid
    - no stipend
    - commission only
    - equity only
    - training fee
    - registration fee
    - security deposit
    - pay to apply
    - bond of
    - service agreement bond
    - night shift only
    - us citizenship required
    - must be us citizen
    - security clearance
    - active clearance
    - relocation to us required

# -----------------------------------------------------------------------------
# FRESHNESS AND VOLUME
# -----------------------------------------------------------------------------
freshness:
  # Postings older than this are not applied to - the role is usually filled or
  # the pipeline is full.
  #
  # WAS 45, AND 45 WAS MEASURED WRONG. `postedAt` is not the date the job was
  # advertised. Greenhouse, Lever and Ashby all report the date the hiring
  # REQUISITION was created, and employers keep an evergreen req open for years
  # without ever re-dating it - so a live Bengaluru backend role reads as 1219
  # days old. Audited against the real 4804-posting corpus: 2879 postings were
  # older than 45 days by this field, and ALL 2879 were still on their board at
  # the last sweep. Not one was actually gone.
  #
  # The cost was the whole funnel. Of the 62 India-located postings that clear
  # the title rules - the real pool - 49 were rejected here and 13 survived.
  #
  # 180 rather than no rule at all, because the field is not useless, only
  # mis-named: a req nobody has touched in six months is a genuinely worse bet
  # than one from last week. And "the job is gone" is already tracked properly
  # elsewhere - discovery sets `closedAt` when a posting disappears from the
  # board, and stage 1 rejects on that first.
  maxAgeDays: 180
  # A posting with no date. Kept: several connectors simply do not report one,
  # and rejecting them would drop whole boards for a missing field.
  allowUnknownAge: true

limits:
  # The hard cap from PLAN-v2 phase 3. Enforced in the pipeline, not here, but
  # stated here because this is the file a human edits.
  maxApplicationsPerDay: 15
  # Applications to one company inside this window. Applying to four roles at
  # the same employer on the same morning reads as spray-and-pray to a recruiter
  # looking at one inbox.
  perCompanyCooldownDays: 14

# -----------------------------------------------------------------------------
# PAY
# -----------------------------------------------------------------------------
pay:
  # A SOFT preference, and PLAN-v2 change 2 is the reason it cannot be more.
  # Structured salary appears on 0.3% of India postings and both instances the
  # spike found were junk, so a floor applied to an absent field would reject
  # essentially everything. The rule that follows from that:
  #
  #   - a STATED salary below the floor rejects       (real data, trust it)
  #   - an LLM ESTIMATE below the floor does not      (a guess, ~99.7% of cases)
  #   - unknown pay passes through                    (the normal case)
  #
  # Ranking by Company.tier is what actually sorts on pay.
  floorLPA: 12
  # Ranked in this order, best first. UNKNOWN sorts last, which is the honest
  # position for a company nobody has classified rather than a penalty.
  tierPreference:
    - T1_GLOBAL_INDIA_OFFICE
    - T2_FUNDED_INDIAN_STARTUP
    - T3_INDIAN_MIDMARKET
    - T4_SERVICES_STAFFING
    - UNKNOWN
