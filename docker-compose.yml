services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: autopilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autopilot}
      POSTGRES_DB: ${POSTGRES_DB:-autopilot}
    # 127.0.0.1, for the reason spelled out on adminer below: a bare
    # '5433:5432' publishes on every interface, and Docker writes its own iptables
    # rules ahead of ufw, so the firewall does not cover it. On a laptop that
    # exposes the database to the coffee shop; on a public VPS it exposes it to the
    # internet, with POSTGRES_PASSWORD defaulting to 'autopilot'.
    #
    # Nothing needs it from off-box. The api, worker and CLI all run on the host
    # and reach it through this published port on loopback; psql and pg_dump go
    # through `docker exec`.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-autopilot} -d ${POSTGRES_DB:-autopilot}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autopilot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    # Loopback, same reasoning as postgres. Redis here has no password at all, so
    # a published port is an unauthenticated remote shell over the queue: anyone
    # reaching it can read every job payload and FLUSHALL the lot.
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # A database browser, for looking at rows by hand. Start it with
  # `npm run db:adminer`; stop it with `npm run db:adminer:stop`.
  #
  # Behind a compose PROFILE on purpose, so it is opt-in. Without the profile it
  # would come up on every `npm run dev`, and this is an unauthenticated web UI
  # with full write access to the database - fine when you deliberately open it,
  # not something that should sit there listening all day.
  #
  # Bound to 127.0.0.1, never 0.0.0.0. A bare '8081:8080' would publish it on
  # every network interface, so anyone on the same wifi could read and edit the
  # database with no password at all. Docker's port publishing also punches
  # straight through ufw, so the firewall would not save you.
  adminer:
    image: adminer:5
    container_name: autopilot-adminer
    profiles: [tools]
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ADMINER_PORT:-8081}:8080'
    environment:
      # Pre-fills the "Server" box. This is the compose service name, reached on
      # the internal network at the standard 5432 - NOT localhost:5433, which is
      # only how the port looks from outside Docker.
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
